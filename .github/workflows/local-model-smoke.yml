name: Verified Qwen3 conversations
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/local-model-smoke.yml'
      - 'app/**'
      - 'evals/cases.json'
      - 'evals/scenarios.json'
      - 'fixtures/**'
      - 'scripts/capture_examples.py'
      - 'scripts/run_evals.py'
      - 'requirements*.txt'
permissions:
  contents: read
jobs:
  conversation:
    name: Qwen3 scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: 1
            cases: '--case product_budget --case product_context --case budget_900 --case switch_product'
          - scenario: 2
            cases: '--case promotion --case payment_followup'
          - scenario: 3
            cases: '--case return --case return_action'
          - scenario: 4
            cases: '--case order_owned --case order_private --case prompt_injection'
          - scenario: 5
            cases: '--case store_hours --case off_topic --case named_price'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Install Ollama on temporary runner
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: ollama pull qwen3:4b-instruct
      - run: python scripts/prepare_data.py --source-dir fixtures --policy-json fixtures/demo_policies.json --db data/demo.db
      - name: Evaluate exact cases, including arguments and product identity
        run: python scripts/run_evals.py --db data/demo.db ${{ matrix.cases }} --output evals/live_result_${{ matrix.scenario }}.json
      - name: Export the same real turns without duplicate inference
        run: python scripts/capture_examples.py --db data/demo.db --scenario ${{ matrix.scenario }} --from-evals evals/live_result_${{ matrix.scenario }}.json --out examples/live_conversation_${{ matrix.scenario }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-scenario-${{ matrix.scenario }}
          if-no-files-found: warn
          path: |
            examples/live_conversation_${{ matrix.scenario }}.md
            evals/live_result_${{ matrix.scenario }}.json
