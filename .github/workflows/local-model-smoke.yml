name: Real Qwen3 conversations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/local-model-smoke.yml'
      - 'app/local_client.py'
      - 'app/agent.py'
      - 'app/routing.py'
      - 'app/tools.py'
      - 'evals/scenarios.json'
      - 'scripts/capture_examples.py'

jobs:
  conversation:
    name: Real Qwen3 scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: 1
            evaluation: budget_900
          - scenario: 2
            evaluation: promotion
          - scenario: 3
            evaluation: return
          - scenario: 4
            evaluation: order_private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Ollama locally on the temporary runner
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1
      - name: Download free Qwen3 4B to the runner
        run: ollama pull qwen3:4b-instruct
      - name: Create database from public fictional fixtures
        run: python scripts/prepare_data.py --source-dir fixtures --policy-json fixtures/demo_policies.json --db data/demo.db
      - name: Capture genuine multi-turn conversation
        run: python scripts/capture_examples.py --db data/demo.db --scenario ${{ matrix.scenario }} --out examples/live_conversation_${{ matrix.scenario }}.md
      - name: Evaluate one representative question
        run: python scripts/run_evals.py --db data/demo.db --case ${{ matrix.evaluation }} --output evals/live_result_${{ matrix.scenario }}.json
      - name: Publish only fictional transcripts and evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-scenario-${{ matrix.scenario }}
          if-no-files-found: warn
          path: |
            examples/live_conversation_${{ matrix.scenario }}.md
            evals/live_result_${{ matrix.scenario }}.json
